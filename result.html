<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 이모티콘 받기 · 말랑모션</title><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');*{box-sizing:border-box}body{margin:0;padding:35px 20px;font-family:Pretendard,sans-serif;color:#26334c;background:radial-gradient(ellipse at 80% 10%,#dfebff,transparent 65%),#f8f9fd;min-height:100vh;display:grid;place-items:center}main{max-width:440px;width:100%;text-align:center;background:#ffffffb0;border:1px solid white;border-radius:28px;padding:30px 24px;box-shadow:0 25px 70px #5670a312}small{color:#98a4bb;font-size:11px}h1{font-size:27px;letter-spacing:-1px;margin:15px 0}p{color:#8c99ad;font-size:13px;line-height:1.8}img{display:block;width:100%;max-width:320px;margin:25px auto;border-radius:18px;background:#fff}a{display:block;padding:17px;border-radius:14px;background:#627eee;color:white;text-decoration:none;font-size:16px;font-weight:700;margin:20px 0}footer{font-size:10px;color:#a5aec0;margin-top:25px}[hidden]{display:none!important}</style></head><body><main><small>2026 시흥 AI+X 미래교육 페스타</small><h1>내 이모티콘이 도착했어요!</h1><p id="status">결과를 불러오고 있어요.</p><img id="gif" alt="완성된 나의 이모티콘" hidden><a id="download" download="malang-emoticon.gif" hidden>GIF 저장하기 ↓</a><p id="note" hidden>움직임이 보이지 않으면 저장한 GIF를 사진 앱에서 확인해 주세요.<br>iPhone에서는 이미지를 길게 눌러 저장할 수도 있어요.</p><footer>개발자: 배곧해솔초 송태민</footer></main><script>const id=new URLSearchParams(location.search).get('id');(async()=>{try{if(!/^[0-9a-f-]{36}$/.test(id||''))throw new Error('결과 링크를 확인해 주세요.');const res=await fetch('/.netlify/functions/jobs?id='+encodeURIComponent(id));const data=await res.json();if(!res.ok||data.status!=='done')throw new Error(data.error||'결과를 아직 확인할 수 없습니다.');document.querySelector('#status').textContent=(data.durationMs?String(data.durationMs/1000)+'초 · ':'')+(data.resultMode==='fallback'?'기본 모션으로 만든 이모티콘입니다.':'나만의 이모티콘을 저장해 보세요.');const img=document.querySelector('#gif');img.src='/.netlify/functions/jobs?id='+encodeURIComponent(id)+'&view=1';img.hidden=false;const a=document.querySelector('#download');a.href=data.url;a.hidden=false;document.querySelector('#note').hidden=false}catch(e){document.querySelector('#status').textContent=e.message}})();</script></body></html>
